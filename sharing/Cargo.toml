[package]
name = "tempodesk-sharing"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Read-only live report sharing and temporary tunnel lifecycle"

[dependencies]
tempodesk-core = { path = "../core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono-tz = "0.10"
sha2 = "0.10.9"
subtle = "2.6.1"
getrandom = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
