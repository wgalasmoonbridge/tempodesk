name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Intel
            os: macos-15-intel
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run typecheck && npm run lint && npm run test

      - name: Build and publish TempoDesk
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TempoDesk __VERSION__
          releaseBody: |
            TempoDesk 0.3.0 adds saved task templates, transactional bulk editing with undo,
            opt-in automatic local backups with retention, and paginated history with complete totals.

            Existing records are preserved through the schema upgrade. Backup format v2 includes
            templates and can restore v1 backups. Automatic backup scheduling stays off after restore.

            This is an unsigned prerelease. See CHANGELOG.md for verification evidence, checksums
            for the locally built Windows artifacts, and known platform limitations.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
