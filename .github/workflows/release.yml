name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Intel
            os: macos-15-intel
            args: ""
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: Linux x64 (experimental)
            os: ubuntu-24.04
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            sharing -> target
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run typecheck && npm run lint && npm run test

      - name: Verify reporting, sharing, and native adapters
        run: cargo test --manifest-path core/Cargo.toml --locked && npm run check:sharing && npm run test:desktop

      - name: Build and publish TempoDesk
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TempoDesk __VERSION__
          releaseBody: |
            TempoDesk includes opt-in machine activity logging and optional live report and
            timesheet sharing from the desktop app.
            Preview the exact filters and fields, create a temporary browser link, replace it,
            and stop sharing from any screen. Links expire and stop when the app quits.

            Existing local records remain on the device. Sharing uses a separate read-only
            connection and carries only the selected report through Cloudflare. The PC and app
            must stay online. Temporary Quick Tunnel addresses are a beta feature without an
            uptime guarantee. Sharing is off until you create a link.

            Machine activity logging is separately opt-in and stays local. Native login/session
            coverage varies by OS; see docs/MACHINE_ACTIVITY.md for capability and runtime limits.
            Linux packages are experimental.

            This is an unsigned prerelease. See CHANGELOG.md for verification evidence, checksums
            for the locally built Windows artifacts, and known platform limitations.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
