name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Intel
            os: macos-15-intel
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            sharing -> target
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run typecheck && npm run lint && npm run test

      - name: Verify reporting and sharing
        run: cargo test --manifest-path core/Cargo.toml --locked && npm run check:sharing

      - name: Build and publish TempoDesk
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TempoDesk __VERSION__
          releaseBody: |
            TempoDesk 0.4.0 adds optional live report and timesheet sharing from the desktop app.
            Preview the exact filters and fields, create a temporary browser link, replace it,
            and stop sharing from any screen. Links expire and stop when the app quits.

            Existing local records remain on the device. Sharing uses a separate read-only
            connection and carries only the selected report through Cloudflare. The PC and app
            must stay online. Temporary Quick Tunnel addresses are a beta feature without an
            uptime guarantee. Sharing is off until you create a link.

            This is an unsigned prerelease. See CHANGELOG.md for verification evidence, checksums
            for the locally built Windows artifacts, and known platform limitations.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
