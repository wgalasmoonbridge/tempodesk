[package]
name = "tempodesk-sharing-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Isolated live report sharing experiment using generated in-memory records only"

[dependencies]
tempodesk-core = { path = "../core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4"
chrono-tz = "0.10"
getrandom = "0.4.3"
sha2 = "0.10.9"
subtle = "2.6.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
