[package]
name = "tempodesk"
version = "0.5.0"
description = "TempoDesk — local-first desktop time tracker"
authors = ["TempoDesk"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "tempodesk_lib"
crate-type = ["rlib"]

[features]
# The unit-test executable needs its own Common Controls v6 manifest on Windows.
native-tests = []

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tempodesk-core = { path = "../core" }
tempodesk-sharing = { path = "../sharing" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target."cfg(target_os = \"linux\")".dependencies]
zbus = "5.19"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent"] }
