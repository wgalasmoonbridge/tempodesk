[package]
name = "tempodesk"
version = "0.1.0"
description = "TempoDesk — local-first desktop time tracker"
authors = ["TempoDesk"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tempodesk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tempodesk-core = { path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target."cfg(target_os = \"linux\")".dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent"] }
